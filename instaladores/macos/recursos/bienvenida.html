<h2>Bienvenido a EspañolCode</h2>
<p>EspañolCode es un lenguaje de programación sencillo en español: escribes instrucciones como <code>decir "Hola mundo"</code> en un archivo <code>.esp</code> y el programa las ejecuta.</p>
<p>Este instalador añade el comando <code>espanolcode</code> a la Terminal y copia unos programas de ejemplo.</p>
